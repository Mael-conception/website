name: Deploy Vite Site to GitHub Pages

on:
  push:
    branches:
      - tailusVersion # Replace 'main' with your branch name if different

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20" # Use the Node.js version compatible with your project

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.WEBSITE_TOKEN }}
          publish_dir: ./dist
